<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}

<script>
const SUPABASE_URL = 'https://dnwpiuwwxvjkmxmtzgnm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRud3BpdXd3eHZqa214bXR6Z25tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjY4MTIsImV4cCI6MjEwNzA0MjgxMn0.ADugjVTw-zDK8hr_x5XO0B11V_1yCvmKin6I1ZlyVzY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var cat="Semua", q="", cart={}, sheetOn=false, tab="toko", owner=false, note="", csOpen=false, tick=null, secret="";
var S = { s: { name: "Freakywayu Store DIGI", wa: "6285187746245", dc: "" }, p: [] };

var $ = function(i){ return document.getElementById(i); };
var esc = function(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); };
var rp = function(v){ return "Rp"+Number(v||0).toLocaleString("id-ID"); };
var digits = function(v){ return String(v||"").replace(/\D/g,""); };

async function initData() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).single();
      if (profile && profile.role === 'owner') owner = true;
    }

    const { data: set } = await sb.from('settings').select('*');
    if (set && set.length > 0) set.forEach(item => { S.s[item.key] = item.value; });

    const { data: prods } = await sb.from('products').select('*').order('created_at', { ascending: false });
    if (prods && prods.length > 0) {
      S.p = prods.map(x => ({ id: x.id, n: x.name, c: x.category||"Umum", pr: x.price, st: x.stock, img: x.image||"", lk: x.pay_link||"", d: "" }));
    }
  } catch (err) {
    console.error("Gagal memuat:", err);
  }
  render();
}

function getWaLink(item, qty){
  var w = digits(S.s.wa);
  if(!w) return "";
  var qVal = qty || 1;
  if(item){
    var total = item.pr * qVal;
    var msg = "Halo " + S.s.name + ", saya mau pesan:\n- " + item.n + " x" + qVal + " (" + rp(total) + ")\nTotal: " + rp(total);
    return "https://wa.me/" + w + "?text=" + encodeURIComponent(msg);
  }
  return "https://wa.me/" + w;
}

function csHtml(){
  var w=digits(S.s.wa),d=S.s.dc,l="";
  if(w)l+='<a target="_blank" rel="noopener" href="https://wa.me/'+w+'">WhatsApp</a>';
  if(/^https?:\/\//.test(d))l+='<a target="_blank" rel="noopener" href="'+esc(d)+'">Discord</a>';
  if(!l)return"";
  return '<div class="cs'+(csOpen?" on":"")+'"><div class="menu">'+l+'</div><button class="fab" id="fab">Hubungi CS</button></div>';
}

function shop(){
  return '<section style="padding:20px 0 6px"><h1 style="margin:0 0 10px">Produk digital, pemesanan langsung via WhatsApp</h1><p class="sub">Pilih produk, lalu konfirmasi dan lakukan pembayaran via chat WhatsApp.</p></section><div class="trust"><div><b>Produk diperiksa</b>Info dan stok dicek sebelum tampil.</div><div><b>Harga jelas</b>Spesifikasi dan ketentuan ditulis lengkap.</div><div><b>Kirim cepat</b>Pesanan diproses setelah pembayaran masuk.</div></div><div class="tools"><input type="search" id="q" placeholder="Cari produk..." aria-label="Cari produk" value="'+esc(q)+'"><div class="chips" id="chips"></div></div><div class="grid" id="grid"></div>';
}

function chips(){
  var cs=["Semua"].concat(S.p.map(function(x){return x.c}).filter(function(v,i,a){return v&&a.indexOf(v)===i}));
  $("chips").innerHTML=cs.map(function(c){return '<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
}

function card(x){
  var out=!(x.st>0);
  var href = /^https:\/\//.test(x.lk||"") ? x.lk : getWaLink(x, 1);
  return '<div class="p"><div class="thumb">'+(x.img?'<img alt="'+esc(x.n)+'" src="'+x.img+'">':esc((x.c||x.n).charAt(0)))+'</div><div class="pb"><small>'+esc(x.c||"Umum")+' &middot; '+(out?'Stok habis':'Stok '+x.st)+'</small><h3>'+esc(x.n)+'</h3>'+(x.d?'<p class="d">'+esc(x.d)+'</p>':'')+'<div class="price">'+rp(x.pr)+'</div><a class="btn" target="_blank" rel="noopener" '+((out||!href)?'aria-disabled="true"':'href="'+esc(href)+'"')+'>'+(out?'Habis':(href?'Beli via WA':'Nomor WA Belum Ada'))+'</a><button class="btn alt" data-add="'+esc(x.id)+'"'+(out?' disabled':'')+'>Tambah ke keranjang</button></div></div>';
}

function grid(){
  chips();
  var l=S.p.filter(function(x){return (cat==="Semua"||x.c===cat)&&x.n.toLowerCase().indexOf(q.toLowerCase())>-1});
  $("grid").innerHTML=l.length?l.map(card).join(""):'<p class="sub">Produk tidak ditemukan.</p>';
}

function cartDraw(){
  var t=0,c=0,h=Object.keys(cart).map(function(id){
  var x=S.p.filter(function(p){return p.id===id})[0];if(!x)return"";
  var n=cart[id];t+=x.pr*n;c+=n;
  var lk = /^https:\/\//.test(x.lk||"") ? x.lk : getWaLink(x, n);
  return '<div class="row"><div><b>'+esc(x.n)+'</b><br><small>'+rp(x.pr)+' &times; '+n+' = '+rp(x.pr*n)+'</small></div><div class="qty"><button data-q="-1" data-id="'+esc(id)+'">-</button><span>'+n+'</span><button data-q="1" data-id="'+esc(id)+'">+</button></div>'+(lk?'<a class="btn" style="width:auto;padding:6px 12px;font-size:13px" target="_blank" rel="noopener" href="'+esc(lk)+'">Beli ini</a>':'')+'</div>';
  }).join("");
  $("items").innerHTML=h||'<p class="msg">Keranjang masih kosong.</p>';
  $("sum").textContent=rp(t);
  if($("n"))$("n").textContent=c;
  if($("wo"))$("wo").innerHTML=waOrder();
}

function waOrder(){
  var w=digits(S.s.wa),ids=Object.keys(cart).filter(function(id){return S.p.some(function(p){return p.id===id})});
  if(!w||!ids.length)return"";
  var t=0;
  var itemsList = ids.map(function(id){
    var x=S.p.filter(function(p){return p.id===id})[0];
    t+=x.pr*cart[id];
    return "- "+x.n+" x"+cart[id]+" ("+rp(x.pr*cart[id])+")";
  }).join("\n");

  var m = "Halo " + S.s.name + ",\nsaya mau pesan:\n" + itemsList + "\nTotal: " + rp(t);
  return '<a class="btn alt" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/'+w+'?text='+encodeURIComponent(m)+'">Pesan Semua via WhatsApp</a>';
}

function loginView(){
  return '<div class="login box"><h1 style="font-size:24px;margin:0 0 4px">Masuk Admin</h1><p class="sub">Login menggunakan akun Supabase</p><label for="lu">Email Admin</label><input id="lu" type="email" placeholder="email@domain.com"><label for="lp">Password</label><input id="lp" type="password"><div class="err" id="le"></div><button class="btn" id="lg" style="margin-top:10px">Masuk</button></div>';
}

function tfa(){
  return '<h1>Kode 2FA</h1><p class="sub">Masukkan kunci rahasia 2FA dari akun yang kamu beli untuk mendapat kode 6 digit.</p><div class="box"><label for="sk">Kunci rahasia (secret key)</label><input id="sk" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="contoh: JBSWY3DPEHPK3PXP" value="'+esc(secret)+'"><div class="code" id="cd">------</div><div class="meter"><i id="mt" style="width:0"></i></div><div class="msg" id="tm"></div><button class="btn alt" id="cp" style="margin-top:8px">Salin kode</button></div>';
}

function dash(){
  var h='<h1>Dashboard Admin</h1><p class="sub">Perubahan di bawah akan langsung tersimpan di Database Supabase.</p><div class="box"><b>Pengaturan toko</b><label>Nama toko</label><input data-s="name" value="'+esc(S.s.name)+'"><label>Nomor WhatsApp (format 628xxx)</label><input data-s="wa" value="'+esc(S.s.wa)+'"></div><div class="box"><b>Daftar Produk</b>';
  S.p.forEach(function(x,i){
  h+='<div class="prow">'+(x.img?'<img src="'+esc(x.img)+'">':'<div class="ph">Belum Ada Foto Sampul</div>')+'<div><label>Nama Produk</label><input data-i="'+i+'" data-k="n" value="'+esc(x.n)+'"><div class="two"><div><label>Kategori</label><input data-i="'+i+'" data-k="c" value="'+esc(x.c)+'"></div><div><label>Harga (Rp)</label><input data-i="'+i+'" data-k="pr" value="'+esc(x.pr)+'"></div></div><div class="two"><div><label>Stok</label><input data-i="'+i+'" data-k="st" value="'+esc(x.st)+'"></div><div><label>Link Custom (Opsional)</label><input data-i="'+i+'" data-k="lk" value="'+esc(x.lk)+'"></div></div><label>Upload Foto Sampul</label><input type="file" accept="image/*" data-img-idx="'+i+'"><label>Atau Link Gambar (URL)</label><input data-i="'+i+'" data-k="img" placeholder="https://..." value="'+esc(x.img)+'"></div></div>';
  });
  return h+'</div><button class="btn" id="save" style="margin-top:10px">Simpan Ke Database Cloud</button><div class="msg" id="nt" style="font-weight:bold;color:var(--acc)">'+esc(note)+'</div>';
}

function render(){
  clearInterval(tick);
  var tabs='<button class="tab" data-t="toko" aria-current="'+(tab==="toko")+'">Toko</button><button class="tab" data-t="2fa" aria-current="'+(tab==="2fa")+'">2FA</button>'+(owner?'<button class="tab" data-t="dash" aria-current="'+(tab==="dash")+'">Dashboard</button><button class="tab out" id="lo">Keluar</button>':'<button class="tab" data-t="login" aria-current="'+(tab==="login")+'">Masuk</button>')+'<button class="tab" id="open">Keranjang (<span id="n">0</span>)</button>';
  $("app").innerHTML='<header><div class="wrap bar"><div class="logo">'+esc(S.s.name)+'</div><div class="tabs">'+tabs+'</div></div></header><main class="wrap">'+(tab==="2fa"?tfa():tab==="dash"&&owner?dash():tab==="login"&&!owner?loginView():shop())+'</main><footer><div class="wrap">&copy; 2026 '+esc(S.s.name)+'</div></footer><div class="sheet'+(sheetOn?" on":"")+'" id="sheet"><div class="panel"><div class="row"><b>Keranjang Belanja</b><button class="chip" id="close">Tutup</button></div><div id="items"></div><div class="total"><span>Total Belanja</span><span id="sum">Rp0</span></div><div id="wo"></div><p class="msg">Pesanan diproses via chat WhatsApp.</p></div></div>'+csHtml();
  cartDraw();
  if(tab==="toko")grid();
  if(tab==="2fa"){run();tick=setInterval(run,1000)}
}

/* TOTP Generator */
function b32(s){var a="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",b="",o=[];s=s.replace(/=+$/,"");for(var i=0;i<s.length;i++){var v=a.indexOf(s[i]);if(v<0)return null;b+=("00000"+v.toString(2)).slice(-5)}for(i=0;i+8<=b.length;i+=8)o.push(parseInt(b.substr(i,8),2));return new Uint8Array(o)}
async function totp(sec){
  var k=b32(sec);if(!k||!k.length)return null;
  var c=Math.floor(Date.now()/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);
  dv.setUint32(0,Math.floor(c/4294967296));dv.setUint32(4,c>>>0);
  var key=await crypto.subtle.importKey("raw",k,{name:"HMAC",hash:"SHA-1"},false,["sign"]);
  var h=new Uint8Array(await crypto.subtle.sign("HMAC",key,buf)),o=h[19]&15;
  var n=((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1000000;
  return ("000000"+n).slice(-6);
}
async function run(){
  if(!$("cd"))return;
  var s=secret.replace(/\s+/g,"").toUpperCase(),left=30-Math.floor(Date.now()/1000)%30;
  if($("mt")) $("mt").style.width=(left/30*100)+"%";
  if(!s){$("cd").textContent="------";$("tm").textContent="";return}
  var c=null;try{c=await totp(s)}catch(e){}
  if(!c){$("cd").textContent="------";$("tm").textContent="Kunci tidak valid.";return}
  $("cd").textContent=c.slice(0,3)+" "+c.slice(3);$("tm").textContent="Kode berganti dalam "+left+" detik";
}

async function handleFileUpload(file, idx) {
  $("nt").textContent = "Mengunggah gambar...";
  const fileExt = file.name.split('.').pop();
  const fileName = `${Date.now()}_${idx}.${fileExt}`;
  const { data, error } = await sb.storage.from('products').upload(fileName, file);
  if (error) {
    $("nt").textContent = "Gagal unggah foto: " + error.message;
    return;
  }
  const { data: publicUrlData } = sb.storage.from('products').getPublicUrl(fileName);
  S.p[idx].img = publicUrlData.publicUrl;
  $("nt").textContent = "Foto berhasil diunggah! Klik 'Simpan Ke Database Cloud'.";
  render();
}

async function saveToDatabase() {
  $("nt").textContent = "Menyimpan ke Supabase...";
  try {
    await sb.from('settings').upsert([
      { key: 'name', value: S.s.name },
      { key: 'wa', value: S.s.wa }
    ]);

    for (let prod of S.p) {
      if(prod.id.toString().startsWith("p")) {
        await sb.from('products').insert({
          name: prod.n, category: prod.c, price: prod.pr, stock: prod.st, image: prod.img, pay_link: prod.lk
        });
      } else {
        await sb.from('products').update({
          name: prod.n, category: prod.c, price: prod.pr, stock: prod.st, image: prod.img, pay_link: prod.lk
        }).eq('id', prod.id);
      }
    }
    $("nt").textContent = "✓ Berhasil disimpan ke Cloud!";
    setTimeout(() => { initData(); }, 1500);
  } catch (err) {
    $("nt").textContent = "Gagal menyimpan: " + err.message;
  }
}

async function loginSupabase() {
  const email = $("lu").value;
  const password = $("lp").value;
  $("le").textContent = "Memeriksa...";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    $("le").textContent = "Login gagal: " + error.message;
  } else {
    location.reload();
  }
}

document.addEventListener("click", function(e){
  var t=e.target, d=t.dataset||{};
  if(d.t){tab=d.t;render()}
  else if(d.c!==undefined&&t.classList.contains("chip")){cat=d.c;grid()}
  else if(t.id==="save") saveToDatabase();
  else if(t.id==="lg") loginSupabase();
